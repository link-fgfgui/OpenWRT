name: Build ImmortalWrt 23.05

# Manual only: a full build takes 12-16 hours across the staged jobs.
#
# The probe job clears old caches at the start of a fresh run.  To resume a
# failed build, use "Re-run failed jobs" (not "Re-run all jobs"), otherwise
# the probe job wipes the cache and the build starts from scratch.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-immortalwrt-23.05
  cancel-in-progress: false

jobs:
  probe:
    name: Probe runner
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report CPU, memory and disk
        run: |
          echo "cores: $(nproc)"
          free -h
          df -h /
          df -h "$GITHUB_WORKSPACE"
          grep -m1 'model name' /proc/cpuinfo || true
          cat /etc/os-release
      - name: Clear old caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all -R "${{ github.repository }}" || true

  base:
    name: Base (toolchain + kernel)
    needs: probe
    runs-on: ubuntu-22.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates cpio curl \
            device-tree-compiler diffutils dosfstools e2fsprogs fakeroot fdisk file flex \
            g++ g++-12 gawk gcc gcc-12 gettext git gperf intltool libelf-dev libncurses-dev \
            libssl-dev libtool libxml-parser-perl make mercurial mtools patch perl \
            pkg-config python3 python3-distutils python3-pyelftools \
            python3-setuptools python3-yaml quilt rsync squashfs-tools subversion swig \
            texinfo time unzip uuid-dev wget xz-utils zip zlib1g-dev zstd
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-base
          restore-keys: |
            ow-${{ github.run_id }}-
      - name: Build toolchain and kernel
        timeout-minutes: 320
        env:
          STAGE: base
          OFFLINE: 0
        run: sh scripts/build.sh
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-base
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: _logs-23.05
          if-no-files-found: warn

  packages-1:
    name: Packages (part 1)
    needs: base
    runs-on: ubuntu-22.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates cpio curl \
            device-tree-compiler diffutils dosfstools e2fsprogs fakeroot fdisk file flex \
            g++ g++-12 gawk gcc gcc-12 gettext git gperf intltool libelf-dev libncurses-dev \
            libssl-dev libtool libxml-parser-perl make mercurial mtools patch perl \
            pkg-config python3 python3-distutils python3-pyelftools \
            python3-setuptools python3-yaml quilt rsync squashfs-tools subversion swig \
            texinfo time unzip uuid-dev wget xz-utils zip zlib1g-dev zstd
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-packages-1
          restore-keys: |
            ow-${{ github.run_id }}-
      - name: Build packages
        timeout-minutes: 335
        env:
          STAGE: packages
          OFFLINE: 1
          PACKAGE_TIMEOUT: 19200
        run: sh scripts/build.sh
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-packages-1
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-packages-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: _logs-23.05
          if-no-files-found: warn

  packages-2:
    name: Packages (part 2)
    needs: packages-1
    runs-on: ubuntu-22.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates cpio curl \
            device-tree-compiler diffutils dosfstools e2fsprogs fakeroot fdisk file flex \
            g++ g++-12 gawk gcc gcc-12 gettext git gperf intltool libelf-dev libncurses-dev \
            libssl-dev libtool libxml-parser-perl make mercurial mtools patch perl \
            pkg-config python3 python3-distutils python3-pyelftools \
            python3-setuptools python3-yaml quilt rsync squashfs-tools subversion swig \
            texinfo time unzip uuid-dev wget xz-utils zip zlib1g-dev zstd
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-packages-2
          restore-keys: |
            ow-${{ github.run_id }}-
      - name: Build packages
        timeout-minutes: 335
        env:
          STAGE: packages
          OFFLINE: 1
          PACKAGE_TIMEOUT: 19200
        run: sh scripts/build.sh
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-packages-2
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-packages-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: _logs-23.05
          if-no-files-found: warn

  image:
    name: Image
    needs: packages-2
    runs-on: ubuntu-22.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates cpio curl \
            device-tree-compiler diffutils dosfstools e2fsprogs fakeroot fdisk file flex \
            g++ g++-12 gawk gcc gcc-12 gettext git gperf intltool libelf-dev libncurses-dev \
            libssl-dev libtool libxml-parser-perl make mercurial mtools patch perl \
            pkg-config python3 python3-distutils python3-pyelftools \
            python3-setuptools python3-yaml quilt rsync squashfs-tools subversion swig \
            texinfo time unzip uuid-dev wget xz-utils zip zlib1g-dev zstd
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .work/immortalwrt-23.05
          key: ow-${{ github.run_id }}-${{ github.run_attempt }}-image
          restore-keys: |
            ow-${{ github.run_id }}-
      - name: Install packages and build image
        timeout-minutes: 330
        env:
          STAGE: image
          OFFLINE: 1
        run: sh scripts/build.sh
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-23.05-opi3lts-${{ github.run_id }}
          path: |
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/*.img.gz
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/*.manifest
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/sha256sums
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/packages/kmod-uwe5622*.ipk
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/packages/uwe5622-firmware*.ipk
            .work/immortalwrt-23.05/bin/packages/*/base/kmod-uwe5622*.ipk
            .work/immortalwrt-23.05/bin/packages/*/base/uwe5622-firmware*.ipk
          if-no-files-found: warn
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: _logs-23.05
          if-no-files-found: warn
