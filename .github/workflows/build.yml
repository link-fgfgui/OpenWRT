name: Build ImmortalWrt 23.05

# Manual only.  On a 4-core public runner the full build takes about 1.5-2
# hours, so everything runs in a single job.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-immortalwrt-23.05
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Report runner
        run: |
          echo "cores: $(nproc)"
          free -h
          df -h /
          df -h "$GITHUB_WORKSPACE"
          grep -m1 'model name' /proc/cpuinfo || true
          cat /etc/os-release
      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates cpio curl \
            device-tree-compiler diffutils dosfstools e2fsprogs fakeroot fdisk file flex \
            g++ g++-12 gawk gcc gcc-12 gettext git gperf intltool libelf-dev libncurses-dev \
            libssl-dev libtool libxml-parser-perl make mercurial mtools patch perl \
            pkg-config python3 python3-distutils python3-pyelftools \
            python3-setuptools python3-yaml quilt rsync squashfs-tools subversion swig \
            texinfo time unzip uuid-dev wget xz-utils zip zlib1g-dev zstd
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
      - name: Build image
        timeout-minutes: 340
        run: sh scripts/build.sh
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-23.05-opi3lts-${{ github.run_id }}
          path: |
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/*.img.gz
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/*.manifest
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/sha256sums
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/profiles.json
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/packages/kmod-uwe5622*.ipk
            .work/immortalwrt-23.05/bin/targets/sunxi/cortexa53/packages/uwe5622-firmware*.ipk
            .work/immortalwrt-23.05/bin/packages/*/base/kmod-uwe5622*.ipk
            .work/immortalwrt-23.05/bin/packages/*/base/uwe5622-firmware*.ipk
          if-no-files-found: warn
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v23.05.7-${{ github.run_number }}"
          dir=".work/immortalwrt-23.05/bin/targets/sunxi/cortexa53"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "ImmortalWrt v23.05.7 for Orange Pi 3 LTS"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat "$dir/sha256sums"
            echo '```'
          } > "$notes"
          assets=()
          while IFS= read -r -d '' f; do
            assets+=("$f")
          done < <(find "$dir" -maxdepth 1 -type f \
            \( -name '*.img.gz' -o -name '*.manifest' -o -name 'sha256sums' -o -name 'profiles.json' \) -print0)
          while IFS= read -r -d '' f; do
            assets+=("$f")
          done < <(find "$dir/packages" -maxdepth 1 -type f \
            \( -name 'kmod-uwe5622*.ipk' -o -name 'uwe5622-firmware*.ipk' \) -print0 2>/dev/null)
          while IFS= read -r -d '' f; do
            assets+=("$f")
          done < <(find ".work/immortalwrt-23.05/bin/packages" -type f \
            \( -name 'kmod-uwe5622*.ipk' -o -name 'uwe5622-firmware*.ipk' \) -print0 2>/dev/null)
          ipk_archive="$RUNNER_TEMP/ipk-23.05.7-aarch64_cortex-a53.tar.gz"
          tar -czf "$ipk_archive" \
            --transform='s#^#ipk-23.05.7/#' \
            -C ".work/immortalwrt-23.05/bin" \
            targets/sunxi/cortexa53/packages packages/aarch64_cortex-a53
          assets+=("$ipk_archive")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No release assets found' >&2
            exit 1
          fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              -R "$GITHUB_REPOSITORY" \
              --title "ImmortalWrt 23.05.7 for Orange Pi 3 LTS (build ${{ github.run_number }})" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA"
          fi
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: _logs-23.05
          if-no-files-found: warn
